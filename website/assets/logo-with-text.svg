<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="100%" height="100%">
  <defs>
    <linearGradient id="obsidianBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1F47"/>
      <stop offset="50%" stop-color="#1A122B"/>
      <stop offset="100%" stop-color="#0F0B1A"/>
    </linearGradient>

    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C2A85" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#180F2E" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B3BA7" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#150C28" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="waveGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>

    <radialGradient id="aiCoreLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E9D5FF"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Centered Icon Group -->
  <g transform="translate(144, 15)">
    <path d="M 256 32 L 436 136 L 436 344 L 256 448 L 76 344 L 76 136 Z" fill="url(#obsidianBase)" stroke="#7C3AED" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 256 32 L 436 136 L 256 240 L 76 136 Z" fill="url(#facetLeft)" stroke="#9333EA" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M 436 136 L 436 344 L 256 240 Z" fill="url(#facetRight)" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M 76 136 L 256 240 L 76 344 Z" fill="#130B24" fill-opacity="0.6" stroke="#6B3BA7" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M 76 344 L 256 240 L 436 344 L 256 448 Z" fill="#0D0718" fill-opacity="0.8" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Waveform -->
    <g filter="url(#glow)">
      <path d="M 40 240 Q 60 210, 80 240 T 120 240 T 160 240 T 200 240 T 240 240" fill="none" stroke="#C084FC" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
      <path d="M 85 240 L 100 195 L 115 285 L 130 165 L 145 315 L 160 185 L 175 275 L 190 215 L 205 255 L 220 240 L 256 240" fill="none" stroke="url(#waveGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Graph Nodes -->
    <g opacity="0.9" filter="url(#glow)">
      <line x1="286" y1="170" x2="346" y2="130" stroke="#C084FC" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="346" y1="130" x2="396" y2="160" stroke="#C084FC" stroke-width="2"/>
      <line x1="346" y1="130" x2="356" y2="190" stroke="#C084FC" stroke-width="2"/>
      <line x1="286" y1="170" x2="356" y2="190" stroke="#C084FC" stroke-width="2"/>
      <line x1="396" y1="160" x2="356" y2="190" stroke="#C084FC" stroke-width="2"/>
      <circle cx="286" cy="170" r="4.5" fill="#E9D5FF"/>
      <circle cx="346" cy="130" r="6" fill="#FFFFFF"/>
      <circle cx="396" cy="160" r="5" fill="#C084FC"/>
      <circle cx="356" cy="190" r="5.5" fill="#E9D5FF"/>
    </g>

    <!-- Document -->
    <g transform="translate(300, 268)" opacity="0.95">
      <rect x="0" y="0" width="84" height="100" rx="10" fill="#1B1030" stroke="#A855F7" stroke-width="2"/>
      <path d="M 64 0 L 84 20 L 64 20 Z" fill="#A855F7"/>
      <circle cx="18" cy="26" r="3.5" fill="#C084FC"/>
      <line x1="30" y1="26" x2="68" y2="26" stroke="#E9D5FF" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="18" cy="48" r="3.5" fill="#C084FC"/>
      <line x1="30" y1="48" x2="58" y2="48" stroke="#E9D5FF" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="18" cy="70" r="3.5" fill="#C084FC"/>
      <line x1="30" y1="70" x2="72" y2="70" stroke="#E9D5FF" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- AI Core -->
    <circle cx="256" cy="240" r="50" fill="url(#aiCoreLight)" filter="url(#glow)"/>
    <g transform="translate(256, 240)" filter="url(#glow)">
      <path d="M 0 -30 Q 0 0 -30 0 Q 0 0 0 30 Q 0 0 30 0 Q 0 0 0 -30 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Title & Subtitle Text -->
  <text x="400" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">MEETING COPILOT</text>
  <text x="400" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="16" fill="#C084FC" text-anchor="middle" letter-spacing="3" opacity="0.95">TRANSCRIPTION &amp; AI SUMMARIZATION FOR OBSIDIAN</text>
</svg>
